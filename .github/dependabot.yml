version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      npm-version:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - '*'
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      actions-version:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - '*'
      actions-security:
        applies-to: security-updates
        patterns:
          - '*'
